[package]
name = "install-tests"
version = "0.1.0"
edition = "2021"
description = "E2E test runner for LevitateOS installation process"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.0"
recinit = { path = "../../tools/recinit" }
distro-contract = { path = "../../distro/contract" }
distro-builder = { path = "../../distro/builder" }
recqemu = { path = "../../tools/recqemu" }
recshuttle = { path = "../../tools/recshuttle" }
recpart = { path = "../../tools/recpart" }
recab = { path = "../../tools/recab" }
fsdbg = { path = "../fsdbg" }

